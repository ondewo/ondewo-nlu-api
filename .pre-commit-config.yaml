#############################################################################################
# pre-commit — language-agnostic hooks for this NON-python API repo (proto sources + docs). #
# There is no python code here, so no ruff/mypy/uv. Language-specific tooling (proto doc     #
# generation) is handled by the CI "Generate Documentation" workflow, not by pre-commit.     #
#                                                                                            #
# see https://pre-commit.com/#intro for an introduction to pre-commit                        #
#############################################################################################

# Never touch generated / vendored code:
#   - docs/            generated API docs (index.html / index.md) produced & deployed by CI
#   - google/          vendored third-party googleapis proto sources + their READMEs
#   - *.pb.* / *_pb2*  generated proto stubs (none tracked today, kept for safety)
exclude: '^(docs/|google/)|(\.pb\.|_pb2)'

fail_fast: false
# "fail_fast: false" means pre-commit continues to run hooks after the first failure

repos:

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files  # Prevent giant files from being committed
        args: [ maxkb=1024 ]
      - id: check-json          # validate (does NOT reformat) json/package.json
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: trailing-whitespace  # Trim trailing whitespace
      - id: end-of-file-fixer    # Ensure files end in a single newline

  # Must run BEFORE giticket: it validates the subject the author wrote. giticket then prepends
  # "[<TICKET>] ", which conventional-pre-commit has no way to tolerate (it has no ticket-prefix
  # option), so with the order reversed every commit on a branch matching giticket's regex is
  # rejected — giticket rewrites the message and the next hook fails it for the rewrite. Same order
  # as ondewo-cai.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]

  - repo: https://github.com/milin/giticket
    rev: '1.92'
    hooks:
      - id: giticket  # Prepend the commit message with the JIRA ticket
        args: [ '--regex=(?:(?:feature|bugfix|support|hotfix)/)?(OND[0-9]{3}-[0-9]{1,5})[_-][\w-]+',
                '--format=[{ticket}] {commit_msg}',
                '--mode=regex_match' ]
